name: Verify Double Advanced
on:
  push:
    branches: [main]
    paths:
      - 'curriculum-web/**'
      - '.github/workflows/pages.yml'
      - 'CNAME'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public site and verify no answer fields
        run: npm run build:pages --prefix curriculum-web
      - name: Verify the branch-published website
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --location --max-time 20 "https://donteventry.me/curriculum-web/public/app.js?revision=${{ github.sha }}" -o /tmp/double-advanced-app.js && cmp -s curriculum-web/public/app.js /tmp/double-advanced-app.js; then
              echo "Verified the exact published application over HTTPS."
              exit 0
            fi
            sleep 20
          done
          echo "The published site has not served this application revision yet."
          exit 1
