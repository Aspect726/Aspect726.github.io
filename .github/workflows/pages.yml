name: Verify Double Advanced practice
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: curriculum-web/package-lock.json
      - run: npm ci --prefix curriculum-web
      - run: npm test --prefix curriculum-web
      - run: npm run build:pages --prefix curriculum-web
  private-paper-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix curriculum-web
      - name: Load private paper and slide exclusion data
        env:
          PAPER_BANK_GZIP_BASE64_1: ${{ secrets.PAPER_BANK_GZIP_BASE64_1 }}
          PAPER_BANK_GZIP_BASE64_2: ${{ secrets.PAPER_BANK_GZIP_BASE64_2 }}
        run: |
          python - <<'PY'
          import os,base64,gzip,pathlib
          value=os.environ['PAPER_BANK_GZIP_BASE64_1']+os.environ['PAPER_BANK_GZIP_BASE64_2']
          if not value:
              raise SystemExit('Private paper-bank secrets are required. This release check cannot be skipped.')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper_questions.json'
          target.write_bytes(gzip.decompress(base64.b64decode(value,validate=True)))
          target.chmod(0o600)
          PY
      - name: Validate every permitted seed and all 70 days
        env:
          PAPER_QUESTIONS_PATH: ${{ runner.temp }}/paper_questions.json
        run: npm run test:paper --prefix curriculum-web -- --write-pool
      - name: Reject paper template frames and verify every approved seed
        env:
          PAPER_QUESTIONS_PATH: ${{ runner.temp }}/paper_questions.json
          VETTED_SEEDS_PATH: private/vetted-seeds.json
          FRAME_REPORT_PATH: private/frame-validation.json
        working-directory: curriculum-web
        run: npm run test:frames
      - run: npm run build --prefix curriculum-web
      - run: node curriculum-web/scripts/smoke-worker.mjs
      - name: Remove private test data
        if: always()
        run: rm -f "${{ runner.temp }}/paper_questions.json"
