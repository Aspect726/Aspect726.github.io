name: Publish Double Advanced
on:
  push:
    branches: [main]
    paths:
      - 'curriculum-web/**'
      - '.github/workflows/pages.yml'
      - 'CNAME'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build public site and verify no answer fields
        run: npm run build:pages --prefix curriculum-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: curriculum-web/dist
      - uses: actions/deploy-pages@v4
        id: deployment
